{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-4">
        <div class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Transaction Details</h4>
                <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-light rounded-pill border px-3">Back</a>
            </div>
            
            <div class="text-center mb-4 pb-4 border-bottom">
                <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 64px; height: 64px; background-color: #F3F4F6;">
                    <i class="bi bi-shop fs-3 text-muted"></i>
                </div>
                <h3 class="fw-bold mb-1">{{ txn.merchant }}</h3>
                <h1 class="fw-bold mt-2 text-main">₹{{ "%.2f"|format(txn.amount) }}</h1>
                <div class="badge risk-low px-3 py-2 mt-2" style="font-size: 0.85rem;">{{ txn.category }}</div>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between py-3 border-bottom">
                    <span class="text-muted fw-bold">Date</span>
                    <span class="fw-bold">{{ txn.date }}</span>
                </div>
                <div class="d-flex justify-content-between py-3 border-bottom">
                    <span class="text-muted fw-bold">Transaction ID</span>
                    <span class="fw-bold text-muted">#{{ txn.id }}</span>
                </div>
            </div>
            
            <form method="POST">
                <button type="submit" name="delete" value="1" class="btn pill-btn btn-outline-danger w-100" onclick="return confirm('Are you sure you want to delete this transaction?');">
                    <i class="bi bi-trash"></i> Delete Transaction
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
