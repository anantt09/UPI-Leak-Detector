{% extends 'base.html' %}
{% block content %}
<div class="login-container">
    <div class="trust-badges">
        <div class="trust-badge" data-bs-toggle="modal" data-bs-target="#securityModal">
            <i class="bi bi-shield-check"></i>
            <div>RBI<br>Compliant</div>
        </div>
        <div class="trust-badge" data-bs-toggle="modal" data-bs-target="#securityModal">
            <i class="bi bi-lock-fill"></i>
            <div>256-bit<br>Encryption</div>
        </div>
    </div>

    <div class="glass-card">
        <form method="POST">
            <div class="mb-4">
                <label class="form-label">Email or Username</label>
                <div class="input-group pill-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group pill-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    <span class="input-group-text" style="padding-right: 1.25rem;"><i class="bi bi-eye"></i></span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.875rem;">
                        Remember me
                    </label>
                </div>
                <a href="#" style="font-size: 0.875rem;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn pill-btn pill-btn-primary">Sign In Securely</button>
            
            <div class="text-center mt-4">
                <p class="text-muted mb-0" style="font-size: 0.875rem;">
                    <i class="bi bi-lock-fill text-success"></i> Secure SSL Connection
                </p>
                <p class="mt-4 text-muted" style="font-size: 0.875rem;">Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
