{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-2">
        <div class="page-header mb-4 text-center">
            <h2 class="page-title fw-bold">New Spend</h2>
            <p class="page-subtitle">Manually add a transaction to your tracker</p>
        </div>
        
        <div class="glass-card">
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Amount (₹)</label>
                    <div class="input-group pill-group">
                        <span class="input-group-text fw-bold">₹</span>
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Date</label>
                    <div class="input-group pill-group">
                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Merchant / Paid To</label>
                    <div class="input-group pill-group">
                        <span class="input-group-text"><i class="bi bi-shop"></i></span>
                        <input type="text" name="merchant" class="form-control" placeholder="e.g. Swiggy, Amazon, Kirana Store" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Category</label>
                    <div class="input-group pill-group">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <select name="category" class="form-control bg-transparent text-muted" required>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Transport">Transport</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Bank Import">Bank Import</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn pill-btn pill-btn-primary w-100 mt-4">Save Transaction</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
